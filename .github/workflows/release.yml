# Builds the single-file web app and the Android APK. Runs on every version tag (v*) and by hand ("Run workflow").
# On a tag, both files are attached to a GitHub Release; the app's updater and the share links read "releases/latest".
name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional: publish a release with this tag (e.g. v0.3.0) from the selected branch'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "0.2.0" on tag v0.2.0; manual runs are dev builds (the in-app updater ignores non x.y.z versions)
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_version || 'dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node --test src/lib/*.test.ts
      - run: VITE_APP_VERSION="${APP_VERSION#v}" npm run build
      - run: npx cap sync android
      - name: Build APK (release-signed when the keystore secret exists, else debug)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ARGS="-PappVersionName=${APP_VERSION#v} -PappVersionCode=${{ github.run_number }}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/periapsis.p12"
            KEYSTORE_FILE="$RUNNER_TEMP/periapsis.p12" ./gradlew assembleRelease $ARGS
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Periapsis.apk"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') || inputs.release_version != '' }}" = "true" ]; then
            echo "::error::No KEYSTORE_B64 secret: refusing to publish a debug-signed release (users could never update over it)"
            exit 1
          else
            echo "::warning::No KEYSTORE_B64 secret: debug-signed APK (cannot be installed as an update over another build)"
            ./gradlew assembleDebug $ARGS
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Periapsis.apk"
          fi
      - run: |
          mkdir out
          cp "$RUNNER_TEMP/Periapsis.apk" out/Periapsis.apk
          cp dist/index.html out/Periapsis.html
      - uses: actions/upload-artifact@v4
        with:
          name: periapsis
          path: out/
      - if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != ''
        run: gh release create "$APP_VERSION" --target "$GITHUB_SHA" out/Periapsis.apk out/Periapsis.html --title "Periapsis $APP_VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
