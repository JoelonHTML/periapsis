<!doctype html>
<html lang="nl" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>Periapsis</title>
    <!-- Live update: version of this build, and the "native epoch" = which APK it needs (bump it when a change requires new native code) -->
    <meta name="periapsis-version" content="%VITE_APP_VERSION%" />
    <meta name="periapsis-native" content="4" />
    <script>
      // Live-update bootstrap (Android app only). If a newer web build was downloaded earlier (see src/lib/ota.ts) and it fits this APK,
      // replace this page by it BEFORE the app starts. Origin and native bridge stay the same (document.write keeps the window).
      // Safety: two starts in a row that never reach "ready" (src/main.tsx resets the counter) drop the downloaded build again.
      (function () {
        try {
          var C = window.Capacitor
          if (window.__periapsisOta || !C || !C.isNativePlatform || !C.isNativePlatform()) return
          var num = function (v) { var m = /(\d+)\.(\d+)\.(\d+)/.exec(v || ''); return m ? m[1] * 1e6 + m[2] * 1e3 + +m[3] : 0 }
          var meta = function (n) { var e = document.querySelector('meta[name="' + n + '"]'); return e ? e.content : '' }
          var tries = +(localStorage.getItem('periapsis.ota.tries') || 0)
          var open = indexedDB.open('periapsis-ota', 1)
          open.onupgradeneeded = function () { open.result.createObjectStore('kv') }
          var drop = function (db) { try { db.transaction('kv', 'readwrite').objectStore('kv').delete('bundle') } catch (e) {} localStorage.setItem('periapsis.ota.tries', '0') }
          open.onsuccess = function () {
            var db = open.result, get = db.transaction('kv').objectStore('kv').get('bundle')
            get.onsuccess = function () {
              var b = get.result
              if (!b) return
              if (tries >= 2 || b.native !== meta('periapsis-native') || num(b.version) <= num(meta('periapsis-version'))) return drop(db)
              localStorage.setItem('periapsis.ota.tries', String(tries + 1))
              window.__periapsisOta = b.version
              document.open(); document.write(b.html); document.close()
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
