# Builds the single-file web app and the Android APK. Runs on every version tag (v*) and by hand ("Run workflow").
# On a tag, both files are attached to a GitHub Release.
name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node --test src/lib/*.test.ts
      - run: npm run build
      - run: npx cap sync android
      # ponytail: debug-signed APK (key differs per run, so an update needs an uninstall first); add a release keystore secret when that hurts
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Periapsis.apk
          cp dist/index.html out/Periapsis.html
      - uses: actions/upload-artifact@v4
        with:
          name: periapsis
          path: out/
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" out/Periapsis.apk out/Periapsis.html --title "Periapsis $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
